name: connector-boundary

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  import-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check connector does not import core internals
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          connector_root = Path('connector/src/connector')
          forbidden = ('import core', 'from core', 'import core.', 'from core.')
          violations = []

          for path in connector_root.rglob('*.py'):
              text = path.read_text(encoding='utf-8')
              for idx, line in enumerate(text.splitlines(), start=1):
                  stripped = line.strip()
                  if stripped.startswith('#'):
                      continue
                  if any(token in stripped for token in forbidden):
                      violations.append(f'{path}:{idx}: {stripped}')

          if violations:
              print('Forbidden connector imports detected:')
              for violation in violations:
                  print(violation)
              sys.exit(1)

          print('Connector import boundary check passed.')
          PY

      - name: Validate connector version exists
        run: |
          python - <<'PY'
          from pathlib import Path
          version_file = Path('connector/src/connector/_version.py')
          text = version_file.read_text(encoding='utf-8')
          if '__version__' not in text:
              raise SystemExit('Connector version file missing __version__')
          print('Connector version file present.')
          PY
